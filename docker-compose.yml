services:
  app:
    build: .
    container_name: hotel-api
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=hotel_api
      - DB_USERNAME=hotel_api
      - DB_PASSWORD=secret
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    container_name: hotel-mysql
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=secret
      - MYSQL_DATABASE=hotel_api
      - MYSQL_USER=hotel_api
      - MYSQL_PASSWORD=secret
    ports:
      # Exposto no host para clientes como o MySQL Workbench (127.0.0.1:3306)
      - "3306:3306"
    volumes:
      - hotel_mysql_data:/var/lib/mysql

volumes:
  hotel_mysql_data:
